{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}" />
{{ end }}
{{ range .AllTranslations }}
{{ if eq .Language.LanguageCode "en" }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}" />
{{ end }}
{{ end }}
<link rel="describedby" href="{{ "llms.txt" | absURL }}" />
{{- if and .IsPage (eq .Section "posts") (not .Params.externalURL) }}
<link rel="alternate" type="text/markdown" href="{{ .Permalink }}index.md" title="{{ .Title }} (Markdown)" />
{{- end }}
