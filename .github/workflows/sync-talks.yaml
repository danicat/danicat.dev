name: Sync Speaker Deck Talks

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 08:00 UTC
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-talks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Talks from Speaker Deck and Sessionize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSIONIZE_API_URL: ${{ secrets.SESSIONIZE_API_URL }}
        run: |
          uv run scripts/events.py sync

      - name: Commit and Create Pull Request with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify if data/talks.json has changes
          if git diff --quiet data/talks.json; then
            echo "No new talks or slide decks detected in data/talks.json."
            exit 0
          fi

          BRANCH="automation/speakerdeck-sync"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add data/talks.json
          git commit -m "feat(events): sync new talks and slide decks"
          git push origin "$BRANCH" --force

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists and has been updated."
          else
            gh pr create \
              --title "feat(events): sync new talks from Speaker Deck" \
              --body "### Automated Talk & Deck Synchronization

This pull request was automatically generated by the talk synchronization workflow.

- Source Trigger: New presentation detected on [Speaker Deck](https://speakerdeck.com/danicat.rss)
- Abstract Source: [Sessionize](https://sessionize.com/daniela)
- Grounding: Google Search with Gemini Grounding

Please review the event dates, locations, categories, tags, and recording links before merging." \
              --base main \
              --head "$BRANCH"
          fi
