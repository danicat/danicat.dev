name: Sync YouTube Videos

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync YouTube videos and view counts
        run: python3 scripts/videos.py

      - name: Commit and Create Pull Request with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify if data/videos.json has changes
          if git diff --quiet data/videos.json; then
            echo "No changes detected in data/videos.json."
            exit 0
          fi

          BRANCH="automation/youtube-sync"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add data/videos.json
          git commit -m "feat(videos): sync YouTube catalog and view counts"
          git push origin "$BRANCH" --force

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists and has been updated."
          else
            BODY_FILE=$(mktemp)
            printf '%s\n' \
              '### Automated YouTube Catalog Synchronization' \
              '' \
              'This pull request was automatically generated by the YouTube synchronization workflow.' \
              '' \
              '- Source: Channel uploads and curated Conference Talks playlist' \
              '- Target: `data/videos.json`' \
              '' \
              'Please review updated view counts, titles, and newly discovered videos before merging.' \
              > "$BODY_FILE"

            gh pr create \
              --title "feat(videos): sync YouTube catalog and view counts" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BRANCH"
            rm -f "$BODY_FILE"
          fi
